[package]
name = "wist-validate"
version = "0.9.0" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
authors = ["wist Dev Team"]
description = "Static validators for wist contracts and runtime state"
repository = "https://github.com/dayu-sec/wist-validate"
homepage = "https://github.com/dayu-sec/wist-validate"
documentation = "https://docs.rs/wist-validate"
readme = "README.md"
keywords = ["wist", "validation", "contracts", "config"]
categories = ["development-tools", "config", "data-structures"]

[dependencies]
time = { version = "0.3", features = ["formatting", "parsing"] }
wist-contracts = { version = "0.11" }
#wist-contracts = { version = "0.11", path = "../wist-contracts" }
# 跨进程 seam 报文（agent 面）。
wist-api = { version = "0.11" }
#wist-api = { version = "0.11", path = "../wist-api" }

# 仅供集成测试（tests/）反序列化 fixture 使用，不属于运行时依赖。
[dev-dependencies]
serde_json = "1.0"

[lib]
path = "src/lib.rs"

# 本地联调：与 `wist-contracts` / `wist-api` 同期改动时启用（`[patch]` 让两边解析到同一个
# 路径源，否则会同时存在两份 contracts、类型互不认识）。**发布态不要留**：
# [patch.crates-io]
# wist-contracts = { path = "../wist-contracts" }
# wist-api = { path = "../wist-api" }
