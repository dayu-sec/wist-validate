[package]
name = "wist-validate"
version = "0.1.2" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
authors = ["wist Dev Team"]
description = "Static validators for wist contracts, configuration, and runtime state"
repository = "https://github.com/dayu-sec/wist-validate"
homepage = "https://github.com/dayu-sec/wist-validate"
documentation = "https://docs.rs/wist-validate"
readme = "README.md"
keywords = ["wist", "validation", "contracts", "config"]
categories = ["development-tools", "config", "data-structures"]

[dependencies]
time = { version = "0.3", features = ["formatting", "parsing"] }
#wist-contracts = { version = "0.1.1", path = "../wist-contracts" }
wist-contracts = { version = "0.1"  }

# 仅供集成测试（tests/）与单元测试反序列化 fixture 使用，不属于运行时依赖。
[dev-dependencies]
serde_json = "1.0"
toml = "1.1"

[lib]
path = "src/lib.rs"
