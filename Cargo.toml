[package]
name = "wist-validate"
version = "0.13.0" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
authors = ["wist Dev Team"]
description = "Static validators for wist contracts and runtime state"
repository = "https://github.com/dayu-sec/wist-validate"
homepage = "https://github.com/dayu-sec/wist-validate"
documentation = "https://docs.rs/wist-validate"
readme = "README.md"
keywords = ["wist", "validation", "contracts", "config"]
categories = ["development-tools", "config", "data-structures"]

[dependencies]
time = { version = "0.3", features = ["formatting", "parsing"] }
wist-contracts = { version = "0.15" }
# 本地联调：切 path（整条链一起切）
#wist-contracts = { version = "0.12", path = "../wist-contracts" }

# 跨进程 seam 报文（agent 面）。
wist-api = { version = "0.13" }
# 本地联调：切 path（整条链一起切）
#wist-api = { version = "0.13", path = "../wist-api" }

# 仅供集成测试（tests/）反序列化 fixture 使用，不属于运行时依赖。
[dev-dependencies]
serde_json = "1.0"

[lib]
path = "src/lib.rs"

# 本地联调：与 `wist-contracts` / `wist-api` 同期改动时启用（`[patch]` 让两边解析到同一个
# 路径源，否则会同时存在两份 contracts、类型互不认识）。**发布态不要留**：
#
# E0（`ActionPlanStep.args`）：contracts 0.13 / api 0.13.1 尚未发布，本轮启用。
[patch.crates-io]
# 2026-11-22：contracts 0.14.0 / api 0.13.2 已上 crates.io，patch 保持注释；
# 留着会让 CI 报 `patch location ... does not contain packages`（siblings 在 CI 上不存在）。
# wist-contracts = { path = "../wist-contracts" }
# wist-api = { path = "../wist-api" }
